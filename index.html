<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor 3D v8</title>
<style>
  :root {
    --bg: #000;
    --ink: #eef1f4;
    --dim: #8e98a4;
    --line: #2b323b;
    --panel: #0d1014;
    --accent: #5ac8fa;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #ver {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #5ac8fa;
    opacity: .7;
    pointer-events: none;
  }
  body.proyector #ver { display: none; }

  #status {
    position: absolute;
    top: 12px; left: 14px; right: 14px;
    max-width: 55%;
    font-size: 14px;
    color: var(--dim);
    pointer-events: none;
    line-height: 1.4;
  }
  #status.error { color: #ff8a80; }

  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0));
  }
  body.proyector #bar { display: none; }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    padding: 12px 16px;
    min-height: 44px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }
  .btn:active { background: #1a2028; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); }
  label.btn { position: relative; overflow: hidden; }
  input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

  #menu {
    position: fixed;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: none;
    opacity: .35;
  }
  body.proyector #menu { display: inline-flex; }

  #cam {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: min(36vw, 260px);
    display: none;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  body.proyector #cam { opacity: 0; pointer-events: none; }
  #camWrap { position: relative; transform: scaleX(-1); background: #000; }
  #camVideo, #camCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #camInfo { padding: 8px 10px; font-size: 13px; color: var(--dim); line-height: 1.35; }
  #camInfo.ok { color: var(--accent); }
  #camInfo.error { color: #ff8a80; }
  #cursor {
    position: fixed;
    left: 0; top: 0;
    width: 44px; height: 44px;
    display: none;
    pointer-events: none;
    z-index: 5;
  }
  #camWrap.directo { transform: none; }
  #camAcciones { display: flex; gap: 6px; padding: 0 8px 8px; }
  .btn.mini { flex: 1; justify-content: center; font-size: 13px; padding: 8px 6px; min-height: 40px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="cursor">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="16" fill="rgba(90,200,250,.15)" stroke="#2b323b" stroke-width="3"/>
      <circle id="cursorAnillo" cx="22" cy="22" r="16" fill="none" stroke="#5ac8fa" stroke-width="3"
              stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 22 22)"/>
    </svg>
  </div>
  <div id="ver">Versión 8 · cambiar cámara</div>
  <div id="status" role="status">Modelo de prueba. Toca "Agregar pieza .stl" para cargar tus diseños.</div>

  <div id="bar">
    <label class="btn primary">Agregar pieza .stl<input id="archivo" type="file" multiple></label>
    <button class="btn" id="girar" type="button">Girar pieza 90°</button>
    <button class="btn" id="borrar" type="button">Borrar piezas</button>
    <button class="btn" id="auto" type="button" aria-pressed="false">Rotación automática</button>
    <button class="btn" id="reset" type="button">Restablecer vista</button>
    <button class="btn" id="full" type="button">Pantalla completa</button>
    <button class="btn" id="camBtn" type="button">Activar cámara</button>
    <button class="btn" id="proy" type="button">Modo proyector</button>
  </div>
  <button class="btn" id="menu" type="button">Menú</button>

  <div id="cam">
    <div id="camWrap">
      <video id="camVideo" playsinline muted></video>
      <canvas id="camCanvas"></canvas>
    </div>
    <div id="camInfo" role="status"></div>
    <div id="camAcciones">
      <button class="btn mini" id="camSwitch" type="button">Cambiar cámara</button>
      <button class="btn mini" id="camEspejo" type="button" aria-pressed="true">Espejo: sí</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(2.6, 1.8, 3.6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.75));
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(3, 5, 4);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x88aaff, 0.35);
  rim.position.set(-4, -2, -3);
  scene.add(rim);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 2.0;
  controls.update();
  controls.saveState();

  // Todas las piezas viven dentro de "pivot": girar o hacer zoom mueve la escena completa
  var pivot = new THREE.Group();
  scene.add(pivot);

  var COLORES = [0x9fd4ff, 0xffc98a, 0xa8e6a1, 0xf4a6c8, 0xd2b7ff, 0xf6e58d];
  var piezas = [];          // cada una: { grupo, malla, demo }
  var seleccion = null;
  var escalaBase = null;    // la misma escala para todas, así conservan sus proporciones
  var bordeDerecho = 0;

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  function restablecer() {
    controls.reset();
    pivot.rotation.set(0, 0, 0);
    pivot.scale.setScalar(1);
  }

  var hover = null;   // pieza sobre la que está el cursor del dedo

  function refrescarEmisivos() {
    piezas.forEach(function (p) {
      p.malla.material.emissive.setHex(p === seleccion ? 0x1b5a80 : (p === hover ? 0x0d2a3a : 0x000000));
    });
  }

  function seleccionar(pieza) {
    seleccion = pieza;
    refrescarEmisivos();
  }

  function piezaActiva() {
    return seleccion || (piezas.length === 1 ? piezas[0] : null);
  }

  function borrarTodo() {
    piezas.forEach(function (p) {
      pivot.remove(p.grupo);
      p.malla.geometry.dispose();
      p.malla.material.dispose();
    });
    piezas = [];
    seleccion = null;
    hover = null;
    escalaBase = null;
    bordeDerecho = 0;
  }

  function agregarGeometria(geom, esStl, demo) {
    if (!demo && piezas.length === 1 && piezas[0].demo) borrarTodo();

    geom.center();
    geom.computeBoundingBox();
    var size = new THREE.Vector3();
    geom.boundingBox.getSize(size);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    if (escalaBase === null) escalaBase = 2 / maxDim;

    var material = new THREE.MeshStandardMaterial({
      color: COLORES[piezas.length % COLORES.length], metalness: 0.15, roughness: 0.55
    });
    var malla = new THREE.Mesh(geom, material);
    malla.scale.setScalar(escalaBase);
    // Los STL de Tinkercad y la mayoría de programas CAD usan Z hacia arriba
    malla.rotation.x = esStl ? -Math.PI / 2 : 0;

    var grupo = new THREE.Group();
    grupo.add(malla);
    var ancho = size.x * escalaBase;
    var x = piezas.length === 0 ? 0 : bordeDerecho + 0.2 + ancho / 2;
    grupo.position.set(x, 0, 0);
    bordeDerecho = x + ancho / 2;
    pivot.add(grupo);

    var pieza = { grupo: grupo, malla: malla, demo: !!demo };
    piezas.push(pieza);
    if (piezas.length === 1) restablecer();
    return pieza;
  }

  // Modelo de prueba
  agregarGeometria(new THREE.TorusKnotGeometry(0.6, 0.2, 160, 20), false, true);

  function cargarArchivos(lista) {
    var archivos = Array.prototype.slice.call(lista);
    var fallos = 0;
    setStatus('Cargando ' + archivos.length + ' archivo(s)…', false);
    archivos.reduce(function (cadena, file) {
      return cadena.then(function () {
        return file.arrayBuffer().then(function (buf) {
          var geom = new THREE.STLLoader().parse(buf);
          if (!geom.attributes.position || geom.attributes.position.count === 0) {
            throw new Error('vacío');
          }
          agregarGeometria(geom, true, false);
        }).catch(function () { fallos++; });
      });
    }, Promise.resolve()).then(function () {
      if (fallos) {
        setStatus('No se pudieron leer ' + fallos + ' archivo(s). Verifica que sean .stl válidos.', true);
      } else {
        setStatus(piezas.length + ' pieza(s) en la escena. Toca una pieza para elegirla.', false);
      }
    });
  }

  document.getElementById('archivo').addEventListener('change', function (e) {
    if (e.target.files && e.target.files.length) cargarArchivos(e.target.files);
    e.target.value = '';
  });

  document.getElementById('girar').addEventListener('click', function () {
    var p = piezaActiva();
    if (p) {
      p.malla.rotation.x += Math.PI / 2;
    } else {
      setStatus('Toca una pieza para elegirla y luego gírala.', false);
    }
  });

  document.getElementById('borrar').addEventListener('click', function () {
    borrarTodo();
    setStatus('Sin piezas. Toca "Agregar pieza .stl" para cargar tus diseños.', false);
  });

  // Elegir una pieza tocándola en la pantalla
  var raycaster = new THREE.Raycaster();
  var inicio = null;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    inicio = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!inicio) return;
    var movido = Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y);
    var rapido = Date.now() - inicio.t < 500;
    inicio = null;
    if (movido > 8 || !rapido) return;
    var r = renderer.domElement.getBoundingClientRect();
    var ndc = new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    var golpe = raycaster.intersectObjects(piezas.map(function (p) { return p.malla; }), false)[0];
    var elegida = null;
    if (golpe) {
      piezas.forEach(function (p) { if (p.malla === golpe.object) elegida = p; });
    }
    seleccionar(elegida);
    setStatus(elegida ? 'Pieza elegida. Muévela con el dedo índice.' : 'Ninguna pieza elegida.', false);
  });

  // Mover la pieza elegida en el plano de la pantalla (dxN, dyN en fracción de pantalla)
  var vR = new THREE.Vector3(), vU = new THREE.Vector3(), vF = new THREE.Vector3();
  function moverPieza(dxN, dyN) {
    var p = piezaActiva();
    if (!p) return false;
    var dist = camera.position.distanceTo(controls.target);
    var alto = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var ancho = alto * camera.aspect;
    camera.updateMatrixWorld();
    camera.matrixWorld.extractBasis(vR, vU, vF);
    var d = new THREE.Vector3()
      .addScaledVector(vR, dxN * ancho)
      .addScaledVector(vU, dyN * alto);
    d.applyQuaternion(pivot.quaternion.clone().invert()).divideScalar(pivot.scale.x);
    p.grupo.position.add(d);
    return true;
  }

  // Desplazar la vista (cámara y punto de mira juntos), sin mover las piezas.
  // dxN, dyN: fracción de pantalla; positivo = derecha / arriba
  function panCamara(dxN, dyN) {
    var dist = camera.position.distanceTo(controls.target);
    var alto = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var ancho = alto * camera.aspect;
    camera.updateMatrixWorld();
    camera.matrixWorld.extractBasis(vR, vU, vF);
    var d = new THREE.Vector3()
      .addScaledVector(vR, dxN * ancho)
      .addScaledVector(vU, dyN * alto);
    camera.position.sub(d);
    controls.target.sub(d);
  }

  // Girar la pieza elegida sobre sí misma.
  // angY: giro sobre el eje vertical de la pantalla, angX: sobre el horizontal (radianes)
  var qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), qp = new THREE.Quaternion();
  function rotarPieza(angY, angX) {
    var p = piezaActiva();
    if (!p) return false;
    camera.updateMatrixWorld();
    camera.matrixWorld.extractBasis(vR, vU, vF);
    qa.setFromAxisAngle(vU.normalize(), angY);
    qb.setFromAxisAngle(vR.normalize(), angX);
    qa.multiply(qb);
    qp.copy(pivot.quaternion);
    var m = qp.clone().invert().multiply(qa).multiply(qp);
    p.grupo.quaternion.premultiply(m);
    return true;
  }

  // Cursor controlado por el dedo índice: mantenerlo sobre una pieza la elige
  var cursorEl = document.getElementById('cursor');
  var anilloEl = document.getElementById('cursorAnillo');
  var rayoCursor = new THREE.Raycaster();
  var hoverDesde = 0;
  var TIEMPO_ELEGIR = 700;

  function ocultarCursor() {
    cursorEl.style.display = 'none';
    if (hover) {
      hover = null;
      refrescarEmisivos();
    }
  }

  function cursor(nx, ny) {
    var r = stage.getBoundingClientRect();
    cursorEl.style.display = 'block';
    cursorEl.style.transform = 'translate(' + (r.left + nx * r.width - 22) + 'px,' + (r.top + ny * r.height - 22) + 'px)';
    rayoCursor.setFromCamera(new THREE.Vector2(nx * 2 - 1, -(ny * 2 - 1)), camera);
    var golpe = rayoCursor.intersectObjects(piezas.map(function (p) { return p.malla; }), false)[0];
    var sobre = null;
    if (golpe) {
      piezas.forEach(function (p) { if (p.malla === golpe.object) sobre = p; });
    }
    var ahora = performance.now();
    if (sobre !== hover) {
      hover = sobre;
      hoverDesde = ahora;
      refrescarEmisivos();
    }
    var prog = hover ? Math.min(1, (ahora - hoverDesde) / TIEMPO_ELEGIR) : 0;
    anilloEl.style.strokeDashoffset = String(100.5 * (1 - prog));
    if (hover && prog >= 1) {
      var elegida = hover;
      hover = null;
      seleccionar(elegida);
      cursorEl.style.display = 'none';
      setStatus('Pieza elegida. Muévela con el índice o gírala con índice y meñique arriba.', false);
      return 'Pieza elegida';
    }
    return hover ? 'Mantén el dedo sobre la pieza para elegirla…' : 'Apunta a una pieza con el índice';
  }

  window.visor = {
    pivot: pivot,
    mover: moverPieza,
    rotarPieza: rotarPieza,
    pan: panCamara,
    cursor: cursor,
    ocultarCursor: ocultarCursor,
    hayElegida: function () { return !!piezaActiva(); },
    haySeleccion: function () { return !!seleccion; },
    soltar: function () {
      seleccionar(null);
      setStatus('Pieza soltada.', false);
    }
  };

  var autoBtn = document.getElementById('auto');
  autoBtn.addEventListener('click', function () {
    controls.autoRotate = !controls.autoRotate;
    autoBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });

  document.getElementById('reset').addEventListener('click', restablecer);

  function pantallaCompleta(soloEntrar) {
    var el = document.documentElement;
    var activo = document.fullscreenElement || document.webkitFullscreenElement;
    var aviso = 'No se pudo activar la pantalla completa aquí. Abre el enlace directamente en Chrome.';
    try {
      if (activo) {
        if (!soloEntrar) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      var pedir = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!pedir) { setStatus(aviso, true); return; }
      var p = pedir.call(el);
      if (p && p.catch) p.catch(function () { setStatus(aviso, true); });
    } catch (e) {
      setStatus(aviso, true);
    }
  }

  document.getElementById('full').addEventListener('click', function () {
    pantallaCompleta(false);
  });

  document.getElementById('proy').addEventListener('click', function () {
    document.body.classList.add('proyector');
    statusEl.style.display = 'none';
    pantallaCompleta(true);
  });
  document.getElementById('menu').addEventListener('click', function () {
    document.body.classList.remove('proyector');
    statusEl.style.display = '';
  });

  function ajustar() {
    var w = stage.clientWidth || 1;
    var h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) {
    new ResizeObserver(ajustar).observe(stage);
  }
  window.addEventListener('resize', ajustar);
  ajustar();

  function animar() {
    requestAnimationFrame(animar);
    controls.update();
    renderer.render(scene, camera);
  }
  animar();
})();
</script>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const btn = document.getElementById('camBtn');
const box = document.getElementById('cam');
const wrap = document.getElementById('camWrap');
const video = document.getElementById('camVideo');
const canvas = document.getElementById('camCanvas');
const info = document.getElementById('camInfo');
const ctx = canvas.getContext('2d');

const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODELO = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const DEDOS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

const SENSIBILIDAD_GIRO = 6;   // más alto = gira más con el mismo movimiento
const GANANCIA_MOVER = 1.3;    // más alto = la pieza se mueve más con el mismo movimiento
const SENSIBILIDAD_PIEZA = 6;  // giro de la pieza (índice y meñique arriba)
const TIEMPO_SOLTAR = 800;     // ms con la mano abierta para soltar la pieza
const GANANCIA_PAN = 1.3;      // más alto = la vista se desplaza más con el mismo movimiento
const ESCALA_MIN = 0.3, ESCALA_MAX = 4;

let landmarker = null, stream = null, activa = false, ultimoT = -1;
let facing = 'user';      // 'user' = cámara frontal, 'environment' = trasera
let espejo = true;        // imagen en espejo (cámara que mira hacia ti)
const sx = () => (espejo ? -1 : 1);

function mensaje(texto, clase) {
  info.textContent = texto;
  info.className = clase || '';
}

async function crearDetector() {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  const opciones = (delegado) => ({
    baseOptions: { modelAssetPath: MODELO, delegate: delegado },
    runningMode: 'VIDEO',
    numHands: 2
  });
  try {
    return await HandLandmarker.createFromOptions(vision, opciones('GPU'));
  } catch (e) {
    return await HandLandmarker.createFromOptions(vision, opciones('CPU'));
  }
}

async function abrirCamara() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  wrap.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
}

async function iniciar() {
  btn.disabled = true;
  box.style.display = 'block';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mensaje('La cámara necesita una página https. Sube el archivo a un hosting gratuito y ábrelo desde ahí.', 'error');
    btn.disabled = false;
    return;
  }
  try {
    mensaje('Pidiendo permiso de cámara…');
    await abrirCamara();

    if (!landmarker) {
      mensaje('Cargando detector de manos…');
      landmarker = await crearDetector();
    }
    activa = true;
    btn.textContent = 'Detener cámara';
    mensaje('Muestra tu mano a la cámara.');
    bucle();
  } catch (e) {
    detener();
    if (e && e.name === 'NotAllowedError') {
      mensaje('Permiso de cámara denegado. Actívalo en los permisos del sitio en Chrome.', 'error');
    } else {
      mensaje('No se pudo iniciar la cámara o el detector. Revisa tu conexión e inténtalo de nuevo.', 'error');
    }
    box.style.display = 'block';
  }
  btn.disabled = false;
}

function detener() {
  activa = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
  gestos([]);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  box.style.display = 'none';
  btn.textContent = 'Activar cámara';
}

function distancia(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Pinza: distancia pulgar-índice comparada con el tamaño de la mano
function razonPinza(m) {
  return distancia(m[4], m[8]) / (distancia(m[0], m[9]) || 1);
}

function puntoPinza(m) {
  return { x: (m[4].x + m[8].x) / 2, y: (m[4].y + m[8].y) / 2 };
}

// Dedo estirado: la punta queda más lejos de la muñeca que su articulación media
function estirado(m, punta, medio) {
  return distancia(m[0], m[punta]) > distancia(m[0], m[medio]) * 1.15;
}
function doblado(m, punta, medio) {
  return distancia(m[0], m[punta]) < distancia(m[0], m[medio]) * 1.05;
}
// Solo el índice arriba y los otros tres dedos doblados
function apuntando(m) {
  return estirado(m, 8, 6) && doblado(m, 12, 10) && doblado(m, 16, 14) && doblado(m, 20, 18);
}

// Mano abierta: los cuatro dedos estirados
function esAbierta(m) {
  return estirado(m, 8, 6) && estirado(m, 12, 10) && estirado(m, 16, 14) && estirado(m, 20, 18);
}

// Pose de desplazar la vista: solo el anular doblado (índice, medio y meñique arriba)
function esPanear(m) {
  const anular = distancia(m[0], m[16]);
  return estirado(m, 8, 6) && estirado(m, 12, 10) && estirado(m, 20, 18) &&
         anular < distancia(m[0], m[14]) * 1.1 &&
         anular < distancia(m[0], m[12]) * 0.9;
}

// Pose de giro: índice y meñique arriba, medio y anular doblados
function esRotar(m) {
  return estirado(m, 8, 6) && estirado(m, 20, 18) && doblado(m, 12, 10) && doblado(m, 16, 14);
}

let pinzaAntes = false;
let puntoPrev = null;
let distPrev = null;
let dedoPrev = null;
let garraPrev = null;
let panPrev = null;
let abiertaDesde = null;
let cursorSuave = null;

function limpiarModos(v) {
  dedoPrev = null;
  garraPrev = null;
  panPrev = null;
  abiertaDesde = null;
  cursorSuave = null;
  if (v) v.ocultarCursor();
}

// Devuelve un texto con lo que está haciendo el gesto
function gestos(manos) {
  const v = window.visor;
  const umbral = pinzaAntes ? 0.5 : 0.35;   // histéresis para que no parpadee
  const pinzas = manos.filter((m) => razonPinza(m) < umbral);
  pinzaAntes = pinzas.length > 0;

  if (!v) return pinzas.length ? 'Pinza activa' : (manos.length ? 'Mano detectada' : '');

  // ---- Pinza: girar la vista (una mano) o zoom (dos manos)
  if (pinzas.length) {
    limpiarModos(v);
    if (pinzas.length >= 2) {
      puntoPrev = null;
      const d = distancia(puntoPinza(pinzas[0]), puntoPinza(pinzas[1]));
      if (distPrev) {
        const nueva = v.pivot.scale.x * (d / distPrev);
        v.pivot.scale.setScalar(Math.min(ESCALA_MAX, Math.max(ESCALA_MIN, nueva)));
      }
      distPrev = d;
      return 'Zoom: separa o junta las manos';
    }
    distPrev = null;
    const p = puntoPinza(pinzas[0]);
    if (puntoPrev) {
      v.pivot.rotation.y += sx() * (p.x - puntoPrev.x) * SENSIBILIDAD_GIRO;
      v.pivot.rotation.x += (p.y - puntoPrev.y) * SENSIBILIDAD_GIRO;
    }
    puntoPrev = p;
    return 'Girando la vista';
  }
  puntoPrev = null;
  distPrev = null;

  // ---- Índice arriba: apuntar para elegir pieza, o mover la pieza elegida
  const dedo = manos.find(apuntando);
  if (dedo) {
    garraPrev = null;
    panPrev = null;
    abiertaDesde = null;
    if (v.hayElegida()) {
      v.ocultarCursor();
      cursorSuave = null;
      const p = { x: dedo[8].x, y: dedo[8].y };
      if (dedoPrev) {
        // La imagen de cámara está en espejo, por eso x lleva signo negativo
        v.mover(sx() * (p.x - dedoPrev.x) * GANANCIA_MOVER, -(p.y - dedoPrev.y) * GANANCIA_MOVER);
      }
      dedoPrev = p;
      return 'Moviendo la pieza';
    }
    dedoPrev = null;
    // La imagen está en espejo; se usa solo la zona central de la cámara para llegar a los bordes
    const nx = Math.min(1, Math.max(0, ((espejo ? 1 - dedo[8].x : dedo[8].x) - 0.1) / 0.8));
    const ny = Math.min(1, Math.max(0, (dedo[8].y - 0.1) / 0.8));
    cursorSuave = cursorSuave
      ? { x: cursorSuave.x + (nx - cursorSuave.x) * 0.45, y: cursorSuave.y + (ny - cursorSuave.y) * 0.45 }
      : { x: nx, y: ny };
    return v.cursor(cursorSuave.x, cursorSuave.y);
  }
  dedoPrev = null;
  cursorSuave = null;
  v.ocultarCursor();

  // ---- Solo el anular doblado: desplazar la vista (no las piezas)
  const pan = manos.find(esPanear);
  if (pan) {
    garraPrev = null;
    abiertaDesde = null;
    const c = { x: pan[9].x, y: pan[9].y };
    if (panPrev) {
      // Imagen en espejo: x con signo negativo. La vista se mueve en sentido contrario a la mano
      v.pan(sx() * (c.x - panPrev.x) * GANANCIA_PAN, -(c.y - panPrev.y) * GANANCIA_PAN);
    }
    panPrev = c;
    return 'Desplazando la vista';
  }
  panPrev = null;

  // ---- Índice y meñique arriba (medio y anular doblados): girar la pieza elegida
  const g = manos.find(esRotar);
  if (g) {
    panPrev = null;
    abiertaDesde = null;
    if (!v.hayElegida()) return 'Primero elige una pieza apuntando con el índice';
    const c = { x: g[9].x, y: g[9].y };
    if (garraPrev) {
      v.rotarPieza(sx() * (c.x - garraPrev.x) * SENSIBILIDAD_PIEZA, (c.y - garraPrev.y) * SENSIBILIDAD_PIEZA);
    }
    garraPrev = c;
    return 'Girando la pieza';
  }
  garraPrev = null;

  // ---- Mano abierta sostenida: soltar la pieza elegida
  if (manos.some(esAbierta) && v.haySeleccion()) {
    const ahora = performance.now();
    if (abiertaDesde === null) abiertaDesde = ahora;
    if (ahora - abiertaDesde >= TIEMPO_SOLTAR) {
      abiertaDesde = null;
      v.soltar();
      return 'Pieza soltada';
    }
    return 'Mantén la mano abierta para soltar la pieza…';
  }
  abiertaDesde = null;
  return manos.length ? 'Índice = apuntar y mover · índice+meñique = girar pieza · anular abajo = desplazar vista · pinza = girar vista' : '';
}

function dibujar(manos) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!manos.length) {
    gestos([]);
    mensaje('No veo tu mano. Acércala a la cámara con buena luz.');
    return;
  }
  manos.forEach((m) => {
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(90,200,250,.9)';
    ctx.beginPath();
    DEDOS.forEach(([a, b]) => {
      ctx.moveTo(m[a].x * w, m[a].y * h);
      ctx.lineTo(m[b].x * w, m[b].y * h);
    });
    ctx.stroke();
    ctx.fillStyle = '#fff';
    m.forEach((p) => {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = razonPinza(m) < 0.4 ? '#5ac8fa' : '#ffffff';
    [m[4], m[8]].forEach((p) => {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 7, 0, Math.PI * 2);
      ctx.fill();
    });
    if (apuntando(m)) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(m[8].x * w, m[8].y * h, 9, 0, Math.PI * 2);
      ctx.fill();
    } else if (esPanear(m)) {
      ctx.fillStyle = '#7bd88f';
      ctx.beginPath();
      ctx.arc(m[9].x * w, m[9].y * h, 10, 0, Math.PI * 2);
      ctx.fill();
    } else if (esRotar(m)) {
      ctx.fillStyle = '#ff7a59';
      ctx.beginPath();
      ctx.arc(m[9].x * w, m[9].y * h, 10, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  mensaje(gestos(manos), 'ok');
}

function bucle() {
  if (!activa) return;
  if (video.readyState >= 2 && video.currentTime !== ultimoT) {
    ultimoT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    dibujar(res.landmarks || []);
  }
  requestAnimationFrame(bucle);
}

btn.addEventListener('click', () => { activa ? detener() : iniciar(); });

document.getElementById('camSwitch').addEventListener('click', async () => {
  const anterior = facing;
  facing = facing === 'user' ? 'environment' : 'user';
  if (!activa) return;
  mensaje('Cambiando de cámara…');
  try {
    await abrirCamara();
    mensaje(facing === 'user' ? 'Cámara frontal activa.' : 'Cámara trasera activa.');
  } catch (e) {
    facing = anterior;
    try {
      await abrirCamara();
      mensaje('No se pudo cambiar de cámara.', 'error');
    } catch (e2) {
      detener();
    }
  }
  limpiarModos(window.visor);
});

const espejoBtn = document.getElementById('camEspejo');
espejoBtn.addEventListener('click', () => {
  espejo = !espejo;
  wrap.classList.toggle('directo', !espejo);
  espejoBtn.textContent = 'Espejo: ' + (espejo ? 'sí' : 'no');
  espejoBtn.setAttribute('aria-pressed', String(espejo));
  limpiarModos(window.visor);
});
</script>
